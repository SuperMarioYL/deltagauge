name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned: uv.lock is the dependency contract, and a moving uv could
          # resolve a different lock format. Bump together with the lockfile.
          version: "0.11.3"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest
