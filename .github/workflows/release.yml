name: release

# Builds the wheel + sdist into dist/ on tag v*.*.*; the release pipeline
# attaches dist/* to the GitHub Release and verifies dist/checksums.txt.
# The optional PyPI job is OPT-IN: register the Trusted Publisher for this
# repository, then set the repository variable PYPI_PUBLISH=true. Until then it
# is skipped, so the first release stays green.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION v${version}"
            exit 1
          fi

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.4.4

      - name: Build wheel + sdist
        run: python -m build --sdist --wheel --outdir dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt

      - name: Attach artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes ""
          gh release upload "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz dist/checksums.txt --clobber

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
