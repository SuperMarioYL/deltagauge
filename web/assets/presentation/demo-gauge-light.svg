 x2='760' y2='160' stroke='#d5cbf7' stroke-width='0.6' opacity='0.45'/><line x1='0' y1='200' x2='760' y2='200' stroke='#d5cbf7' stroke-width='0.6' opacity='0.45'/><line x1='0' y1='240' x2='760' y2='240' stroke='#d5cbf7' stroke-width='0.6' opacity='0.45'/><line x1='0' y1='280' x2='760' y2='280' stroke='#d5cbf7' stroke-width='0.6' opacity='0.45'/><text x='24' y='34' fill='#171630' font-size='14' text-anchor='start' font-weight='600' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">gauge：误差预算</text><rect x='588' y='14' width='148' height='24' rx='12.0' fill='#faf9fe' stroke='#d5cbf7' stroke-width='1.1'/><text x='662.0' y='29.96' fill='#686e94' font-size='11' text-anchor='middle' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">合成示例数据</text><text x='24' y='93' fill='#171630' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">Part-to-part（模型 × 题目）</text><rect x='288' y='78' width='277.8' height='22' rx='6' fill='#9b52b2' opacity='0.85'/><text x='573.8294117647058' y='93' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">16.175</text><text x='24' y='137' fill='#171630' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">Repeatability（同一 judge、同一题目）</text><rect x='288' y='122' width='8.6' height='22' rx='6' fill='#7556e6' opacity='0.85'/><text x='304.5710588235294' y='137' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">0.499</text><text x='24' y='181' fill='#171630' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">Reproducibility（judge 之间）</text><rect x='288' y='166' width='7.5' height='22' rx='6' fill='#7556e6' opacity='0.85'/><text x='303.4889411764706' y='181' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">0.436</text><text x='24' y='225' fill='#171630' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">Item × judge 交互</text><rect x='288' y='210' width='3.5' height='22' rx='6' fill='#7556e6' opacity='0.85'/><text x='299.4524705882353' y='225' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">0.201</text><rect x='600' y='58' width='10' height='10' rx='2' fill='#9b52b2'/><text x='616' y='67' fill='#5b5e88' font-size='11' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">信号</text><rect x='668' y='58' width='10' height='10' rx='2' fill='#7556e6'/><text x='684' y='67' fill='#5b5e88' font-size='11' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">测量误差</text><line x1='24' y1='258' x2='736' y2='258' stroke='#d5cbf7' stroke-width='1'/><text x='24' y='282' fill='#7556e6' font-size='11.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">Part-to-part 不计入 GRR；Total GRR 0.692 分 = 重复性 + 再现性 + item × judge</text><text x='736' y='282' fill='#7556e6' font-size='11.5' text-anchor='end' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">decision limit ±1.4</text></svg>