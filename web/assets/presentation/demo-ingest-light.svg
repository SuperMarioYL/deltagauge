150' stroke='#5b5e88' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='286,150 281.2,155.1 279.0,149.9' fill='#5b5e88'/><rect x='292' y='62' width='444' height='128' rx='12' fill='#f8f7fe' stroke='#d5cbf7' stroke-width='1.2'/><text x='308' y='88' fill='#171630' font-size='13.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">canonical run set</text><line x1='308' y1='100' x2='720' y2='100' stroke='#d5cbf7' stroke-width='1'/><text x='308' y='122' fill='#9b52b2' font-size='12' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">model,item,judge,run,score</text><text x='308' y='144' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">spark-open,item-001,judge-a,1,38.4</text><text x='308' y='164' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">spark-open,item-001,judge-b,1,39.1</text><text x='308' y='182' fill='#7556e6' font-size='11.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">→ wrote runs.csv</text><line x1='24' y1='212' x2='736' y2='212' stroke='#d5cbf7' stroke-width='1'/><text x='24' y='240' fill='#5b5e88' font-size='12' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">缺重复维度或只有一个判分 provider 的导出会被拒绝，并点名要补哪个参数。</text><text x='24' y='264' fill='#5b5e88' font-size='12' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">CSV 是自家交换格式；promptfoo / Inspect 的适配器负责找到各自的 model、judge、run。</text></svg>