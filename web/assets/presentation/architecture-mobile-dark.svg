<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" data-palette="7556e6-c86ae7-acb7f6-baf086ee7998" role="img" aria-labelledby="architecture-mobile-dark-title architecture-mobile-dark-desc"><title id="architecture-mobile-dark-title">DeltaGauge 架构蓝图（窄屏）</title><desc id="architecture-mobile-dark-desc">导出经 importers 到 RunSet、gaugerr、ErrorBudget，再到 compare 与 report.md。</desc><style>
