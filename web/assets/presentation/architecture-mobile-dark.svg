ospace,Menlo,Consolas,monospace">importers/</text><text x='40' y='214' fill='#9b9cc4' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">每格式一个适配器 → canonical Observation</text><text x='40' y='232' fill='#acb7f6' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">缺重复维度 → 拒绝并点名参数</text><line x1='280.0' y1='242' x2='280.0' y2='258' stroke='#9b9cc4' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='280.0,258 277.1,251.6 282.9,251.6' fill='#9b9cc4'/><rect x='24' y='252' width='512' height='74' rx='12' fill='#0d101f' stroke='#1e1841' stroke-width='1.2'/><text x='40' y='278' fill='#eef1fd' font-size='13.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">model.py · RunSet</text><text x='40' y='300' fill='#9b9cc4' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">完全交叉 + 平衡性校验</text><text x='40' y='318' fill='#acb7f6' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">缺 cell / 重复 cell → 列出并拒绝</text><line x1='280.0' y1='328' x2='280.0' y2='344' stroke='#9b9cc4' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='280.0,344 277.1,337.6 282.9,337.6' fill='#9b9cc4'/><rect x='24' y='338' width='512' height='74' rx='12' fill='#0d101f' stroke='#1e1841' stroke-width='1.2'/><text x='40' y='364' fill='#eef1fd' font-size='13.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">gaugerr.py</text><text x='40' y='386' fill='#9b9cc4' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">交叉随机效应 ANOVA：四个方差分量 + %GRR</text><text x='40' y='404' fill='#acb7f6' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans