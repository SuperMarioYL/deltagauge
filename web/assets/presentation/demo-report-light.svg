<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" data-palette="7556e6-c86ae7-acb7f6-baf086ee7998" role="img" aria-labelledby="demo-report-light-title demo-report-light-desc"><title id="demo-report-light-title">report：写出 Markdown</title><desc id="demo-report-light-desc">把预算表、判定行与估计量假设写成一份可粘贴的 Markdown 报告。</desc><style>
.dg-pulse { animation: dg-pulse 3.6s ease-in-out infinite; }
.dg-dash { stroke-dasharray: 6 5; animation: dg-dash 2.6s linear infinite; }
.dg-drift-a { animation: dg-drift-a 8s ease-in-out infinite alternate; }
.dg-drift-b { animation: dg-drift-b 10s ease-in-out infinite alternate; }
.dg-sweep { animation: dg-sweep 5s linear infinite; }
@keyframes dg-pulse { 0%,100% { opacity:.32 } 50% { opacity:1 } }
@keyframes dg-dash { to { stroke-dashoffset: -22 } }
@keyframes dg-drift-a { from { transform: translate(0,0) } to { transform: translate(7px,-8px) } }
@keyframes dg-drift-b { from { transform: translate(0,0) } to { transform: translate(-8px,6px) } }
@keyframes dg-sweep { 0% { transform: translateX(-140px) } 100% { transform: translateX(140px) } }
@media (prefers-reduced-motion: reduce) {
  .dg-pulse, .dg-dash, .dg-drift-a, .dg-drift-b, .dg-sweep { animation: none; }
}
