.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">report.md</text><text x='472' y='118' fill='#5b5e88' font-size='11' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">2,015 bytes</text><rect x='456' y='138' width='280' height='52' rx='10' fill='#faf9fe' stroke='#d5cbf7' stroke-width='1'/><text x='472' y='162' fill='#9b52b2' font-size='12.5' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">stdout</text><text x='472' y='180' fill='#5b5e88' font-size='11' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">wrote report.md</text><text x='456' y='212' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">可直接贴进选型 / 采购文档</text><line x1='24' y1='232' x2='736' y2='232' stroke='#d5cbf7' stroke-width='1'/><text x='24' y='256' fill='#5b5e88' font-size='12' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">同一份结果，换成可以粘贴的形状：预算、判定行与假设一起交出去。</text><text x='24' y='278' fill='#5b5e88' font-size='12' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">MIT 许可，report 不设任何限制，包括商用。</text></svg>