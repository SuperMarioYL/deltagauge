 y='212' fill='#171630' font-size='13.5' text-anchor='start' font-weight='600' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">Inspect .eval 日志</text><text x='72' y='234' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">inspect eval --epochs n</text><line x1='252' y1='220' x2='292' y2='220' stroke='#5b5e88' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='292,220 285.6,222.9 285.6,217.1' fill='#5b5e88'/><rect x='56' y='276' width='196' height='72' rx='12' fill='#f8f7fe' stroke='#d5cbf7' stroke-width='1.2'/><text x='72' y='304' fill='#171630' font-size='13.5' text-anchor='start' font-weight='600' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">canonical CSV</text><text x='72' y='326' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="ui-monospace,Menlo,Consolas,monospace">model,item,judge,run,score</text><line x1='252' y1='312' x2='292' y2='312' stroke='#5b5e88' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='292,312 285.6,314.9 285.6,309.1' fill='#5b5e88'/><rect x='292' y='92' width='200' height='256' rx='12' fill='#f8f7fe' stroke='#d5cbf7' stroke-width='1.2'/><text x='308' y='120' fill='#171630' font-size='15' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">importers/</text><text x='308' y='140' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">每种导出格式一个适配器</text><text x='308' y='168' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">csv.py · promptfoo.py</text><text x='308' y='187' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">inspect.py</text><text x='308' y='206' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">统一产出 canonical</text><text x='308' y='225' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">Observation 行</text><line x1='308' y1='256' x2='476' y2='256' stroke='#d5cbf7' stroke-width='1'/><text x='308' y='276' fill='#686e94' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">缺重复维度的导出直接拒绝，并</text><text x='308' y='293' fill='#686e94' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">点名要补哪个参数</text><line x1='492' y1='220' x2='532' y2='220' stroke='#5b5e88' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='532,220 525.6,222.9 525.6,217.1' fill='#5b5e88'/><rect x='532' y='92' width='200' height='112' rx='12' fill='#f8f7fe' stroke='#d5cbf7' stroke-width='1.2'/><text x='548' y='120' fill='#171630' font-size='15' text-anchor='start' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">model.py</text><text x='548' y='142' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">RunSet：完全交叉</text><text x='548' y='161' fill='#5b5e88' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">model × item × judge × run</text><text x='548' y='186' fill='#686e94' font-size='11.5' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">平衡性校验，缺 cell 即拒绝</text><line x1='632' y1='208' x2='632' y2='244' stroke='#5b5e88' stroke-width='1.1' stroke-dasharray='6 5' class='dg-dash'/><polygon points='632,244 629.1,237.6 634.9,237.6' fill='#5b5e88'/><rect x='532' y='244' width='200' height='104' rx='12' fill='#f8f7fe' stroke='#d5cbf7' stroke-width='1.2'/><text x='548' y='272' fill='#17