283' y='100' fill='#9b52b2' font-size='11.5' text-anchor='middle' font-weight='600' font-family="ui-monospace,Menlo,Consolas,monospace">delta -1.0（spark-open − qwen3.8-flash-next）</text><rect x='694' y='127' width='42' height='30' rx='15.0' fill='#faf9fe' stroke='#9b52b2' stroke-width='1.1'/><text x='715.0' y='146.32' fill='#9b52b2' font-size='12' text-anchor='middle' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">NOISE</text><line x1='24' y1='224' x2='736' y2='224' stroke='#d5cbf7' stroke-width='1'/><text x='24' y='250' fill='#5b5e88' font-size='12' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">|delta| &gt; decision_limit → REAL，否则 NOISE。判定限是量具自身的 95% 测量限。</text><text x='24' y='274' fill='#5b5e88' font-size='12' text-anchor='start' font-weight='400' font-family="Arial,'PingFang SC','Noto Sans SC',sans-serif">分差落在限内，无法与这套测量系统本身区分。</text></svg>